services:
  - type: web
    name: argus-fx-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python3 discord_bot.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DISCORD_BOT_TOKEN
        sync: false
